<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260">
  <defs>
    <style>
      .title { font: 700 44px "Microsoft YaHei", "SimHei", sans-serif; fill: #172033; }
      .subtitle { font: 400 22px "Microsoft YaHei", "SimHei", sans-serif; fill: #526078; }
      .h1 { font: 700 29px "Microsoft YaHei", "SimHei", sans-serif; fill: #172033; }
      .h2 { font: 700 24px "Microsoft YaHei", "SimHei", sans-serif; fill: #172033; }
      .body { font: 400 20px "Microsoft YaHei", "SimHei", sans-serif; fill: #344054; }
      .small { font: 400 18px "Microsoft YaHei", "SimHei", sans-serif; fill: #475467; }
      .tag { font: 700 18px "Microsoft YaHei", "SimHei", sans-serif; }
      .center { text-anchor: middle; }
      .arrow { stroke: #667085; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #7c3aed; stroke-width: 3; stroke-dasharray: 10 8; fill: none; marker-end: url(#arrowPurple); }
      .thinDash { stroke: #98a2b3; stroke-width: 2.5; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#667085"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#101828" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1800" height="1260" fill="#f8fafc"/>

  <text x="900" y="62" class="title center">结构描述、关系推断与一般消息传递的整体关系</text>
  <text x="900" y="101" class="subtitle center">先按“目标”划分方法，再用“消息传递”解释其中若干方法的共同计算机制</text>

  <!-- Root -->
  <rect x="620" y="132" rx="18" ry="18" width="560" height="82" fill="#172033" filter="url(#shadow)"/>
  <text x="900" y="183" class="h1 center" fill="#ffffff" style="fill:#ffffff">图信息的建模与利用</text>

  <path d="M900 214 L900 246 L310 246 L310 276" class="arrow"/>
  <path d="M900 214 L900 276" class="arrow"/>
  <path d="M900 214 L900 246 L1490 246 L1490 276" class="arrow"/>

  <!-- Column 1: structural description -->
  <rect x="60" y="276" rx="20" ry="20" width="500" height="500" fill="#eef6ff" stroke="#4b8edb" stroke-width="3" filter="url(#shadow)"/>
  <rect x="60" y="276" rx="20" ry="20" width="500" height="76" fill="#d9ebff"/>
  <text x="310" y="324" class="h1 center">一、结构描述／特征工程</text>
  <text x="88" y="389" class="h2">目的</text>
  <text x="155" y="389" class="body">把图结构变成明确、可解释的数字特征</text>

  <rect x="88" y="420" rx="13" width="444" height="80" fill="#ffffff" stroke="#9dc4ef" stroke-width="2"/>
  <text x="110" y="452" class="h2">节点级</text>
  <text x="110" y="482" class="small">度、中心性、聚类系数、Graphlet/GDV</text>

  <rect x="88" y="516" rx="13" width="444" height="80" fill="#ffffff" stroke="#9dc4ef" stroke-width="2"/>
  <text x="110" y="548" class="h2">连接级</text>
  <text x="110" y="578" class="small">共同邻居、Jaccard、Adamic-Adar、Katz</text>

  <rect x="88" y="612" rx="13" width="444" height="80" fill="#ffffff" stroke="#9dc4ef" stroke-width="2"/>
  <text x="110" y="644" class="h2">全图级</text>
  <text x="110" y="674" class="small">度分布、Graphlet 核、WL 核</text>

  <text x="88" y="730" class="body">输出：显式特征向量</text>
  <text x="298" y="730" class="tag" fill="#1d5f9e">xᵥ、xᵤᵥ、xᴳ</text>
  <text x="88" y="760" class="small">本身通常不直接决定未知标签，而是给后续模型提供输入。</text>

  <!-- Column 2: relational inference -->
  <rect x="590" y="276" rx="20" ry="20" width="620" height="650" fill="#ecfdf3" stroke="#2ca56d" stroke-width="3" filter="url(#shadow)"/>
  <rect x="590" y="276" rx="20" ry="20" width="620" height="76" fill="#d1fadf"/>
  <text x="900" y="324" class="h1 center">二、关系推断（预测目标）</text>
  <text x="618" y="389" class="h2">目的</text>
  <text x="685" y="389" class="body">利用节点依赖、已知标签和当前预测推断未知标签</text>

  <rect x="618" y="420" rx="14" width="564" height="98" fill="#ffffff" stroke="#6fd29b" stroke-width="2"/>
  <text x="640" y="452" class="h2">1. 标签传播（LP）</text>
  <text x="640" y="482" class="small">固定扩散规则；传播标签分数；邻居加权平均；通常依赖同质性。</text>
  <rect x="1018" y="435" rx="12" width="138" height="32" fill="#d1fadf"/>
  <text x="1087" y="458" class="tag center" fill="#18794e">基础扩散方法</text>

  <rect x="618" y="536" rx="14" width="564" height="112" fill="#ffffff" stroke="#6fd29b" stroke-width="2"/>
  <text x="640" y="568" class="h2">2. ICA（迭代分类）</text>
  <text x="640" y="598" class="small">属性分类器产生初值；关系分类器使用 fᵥ 与 zᵥ；</text>
  <text x="640" y="626" class="small">交替更新“邻居标签摘要 ↔ 预测标签”。</text>
  <rect x="998" y="552" rx="12" width="158" height="32" fill="#fff4e5"/>
  <text x="1077" y="575" class="tag center" fill="#b54708">不属于基本 LP</text>

  <rect x="618" y="666" rx="14" width="564" height="112" fill="#ffffff" stroke="#6fd29b" stroke-width="2"/>
  <text x="640" y="698" class="h2">3. Correct &amp; Smooth（C&amp;S）</text>
  <text x="640" y="728" class="small">Correct 传播已标注节点的预测残差；</text>
  <text x="640" y="756" class="small">Smooth 再传播修正后的类别分数。</text>
  <rect x="972" y="682" rx="12" width="184" height="32" fill="#e8f2ff"/>
  <text x="1064" y="705" class="tag center" fill="#175cd3">使用 LP 式扩散算子</text>

  <rect x="618" y="796" rx="14" width="564" height="104" fill="#ffffff" stroke="#6fd29b" stroke-width="2"/>
  <text x="640" y="828" class="h2">4. 置信传播（BP）</text>
  <text x="640" y="858" class="small">传播条件证据；使用节点势与边兼容势；计算 u→v 时排除 v→u。</text>
  <text x="640" y="886" class="small">树上可精确；有环图中为近似推断，且不保证收敛。</text>
  <rect x="982" y="810" rx="12" width="174" height="32" fill="#f4ebff"/>
  <text x="1069" y="833" class="tag center" fill="#6941c6">不是标签传播</text>

  <!-- Column 3: representation learning -->
  <rect x="1240" y="276" rx="20" ry="20" width="500" height="500" fill="#f5f0ff" stroke="#8656ce" stroke-width="3" filter="url(#shadow)"/>
  <rect x="1240" y="276" rx="20" ry="20" width="500" height="76" fill="#e8dcff"/>
  <text x="1490" y="324" class="h1 center">三、图表示学习</text>
  <text x="1268" y="389" class="h2">目的</text>
  <text x="1335" y="389" class="body">学习可复用的节点、连接或全图向量</text>

  <rect x="1268" y="420" rx="13" width="444" height="96" fill="#ffffff" stroke="#bba0e9" stroke-width="2"/>
  <text x="1290" y="452" class="h2">浅层嵌入</text>
  <text x="1290" y="482" class="small">DeepWalk、Node2Vec：每个节点直接学习一行向量。</text>

  <rect x="1268" y="536" rx="13" width="444" height="124" fill="#ffffff" stroke="#bba0e9" stroke-width="2"/>
  <text x="1290" y="568" class="h2">GNN／MPNN</text>
  <text x="1290" y="598" class="small">学习 MESSAGE、AGGREGATE、UPDATE；</text>
  <text x="1290" y="626" class="small">传播隐藏向量，输出表示后再接任务预测头。</text>

  <text x="1268" y="706" class="body">输出：学习到的嵌入</text>
  <text x="1486" y="706" class="tag" fill="#6941c6">hᵥ、hᵤᵥ、hᴳ</text>
  <text x="1268" y="740" class="small">消息通常不是可直接解释的标签概率。</text>

  <!-- Cross relations -->
  <path d="M560 610 C585 610 590 610 618 610" class="thinDash"/>
  <text x="574" y="592" class="small center">特征可供 ICA 使用</text>

  <path d="M560 700 C590 740 588 828 618 846" class="thinDash"/>
  <text x="565" y="796" class="small">特征可形成局部证据</text>

  <path d="M560 470 C690 980 1090 975 1240 610" class="thinDash"/>
  <text x="900" y="958" class="small center">显式结构特征和学习表示都可以进入下游预测器</text>

  <!-- General message-passing band -->
  <rect x="150" y="982" rx="20" ry="20" width="1500" height="132" fill="#ffffff" stroke="#7c3aed" stroke-width="3" stroke-dasharray="12 8" filter="url(#shadow)"/>
  <text x="900" y="1025" class="h1 center" fill="#6d28d9" style="fill:#6d28d9">一般消息传递：发送 MESSAGE → 聚合 AGGREGATE → 更新 UPDATE</text>
  <text x="900" y="1063" class="body center">它是跨方法的“计算机制”，不是与结构描述、关系推断、表示学习并列的任务类别。</text>
  <text x="900" y="1097" class="small center">LP 传标签分数；ICA/C&amp;S 交替传播预测或残差；BP 传条件证据；GNN 传可学习隐藏向量。</text>

  <path d="M755 982 C750 950 752 930 760 900" class="dashed"/>
  <path d="M900 982 L900 900" class="dashed"/>
  <path d="M1045 982 C1050 950 1048 930 1042 900" class="dashed"/>
  <path d="M1350 982 C1430 910 1460 760 1490 660" class="dashed"/>

  <!-- Bottom pipeline -->
  <rect x="105" y="1160" rx="14" width="270" height="64" fill="#eaf3ff" stroke="#4b8edb" stroke-width="2"/>
  <text x="240" y="1200" class="h2 center">图结构＋节点属性</text>
  <path d="M375 1192 L475 1192" class="arrow"/>
  <rect x="475" y="1160" rx="14" width="300" height="64" fill="#eef6ff" stroke="#4b8edb" stroke-width="2"/>
  <text x="625" y="1187" class="h2 center">可选：结构描述／</text>
  <text x="625" y="1214" class="h2 center">基础模型预测</text>
  <path d="M775 1192 L875 1192" class="arrow"/>
  <rect x="875" y="1160" rx="14" width="300" height="64" fill="#ecfdf3" stroke="#2ca56d" stroke-width="2"/>
  <text x="1025" y="1187" class="h2 center">关系推断</text>
  <text x="1025" y="1214" class="small center">LP／ICA／C&amp;S／BP</text>
  <path d="M1175 1192 L1275 1192" class="arrow"/>
  <rect x="1275" y="1160" rx="14" width="420" height="64" fill="#fff6e8" stroke="#e79b32" stroke-width="2"/>
  <text x="1485" y="1187" class="h2 center">最终标签、类别置信度</text>
  <text x="1485" y="1214" class="small center">或供决策使用的排序结果</text>
</svg>
