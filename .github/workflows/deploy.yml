name: Deploy study notes

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      - run: npm run check
      - run: npm run test:markdown
      - run: npm run test:reading
      - run: npm run supabase:check
      - run: npm run supabase:import:dry
      - run: npm run test:search
      - run: npm run test:manager
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          PUBLIC_SUPABASE_URL: https://qsfwywubqvahisqprvxu.supabase.co
          PUBLIC_SUPABASE_KEY: sb_publishable_fFP0rqBd5fVevPdognSm9g_yFufY_qG
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
