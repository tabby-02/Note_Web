<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1500" viewBox="0 0 1920 1500">
  <defs>
    <style>
      .title { font: 700 46px "Microsoft YaHei", "SimHei", sans-serif; fill: #172033; }
      .section { font: 700 32px "Microsoft YaHei", "SimHei", sans-serif; fill: #172033; }
      .h1 { font: 700 27px "Microsoft YaHei", "SimHei", sans-serif; fill: #172033; }
      .h2 { font: 700 23px "Microsoft YaHei", "SimHei", sans-serif; fill: #172033; }
      .body { font: 400 20px "Microsoft YaHei", "SimHei", sans-serif; fill: #344054; }
      .small { font: 400 18px "Microsoft YaHei", "SimHei", sans-serif; fill: #475467; }
      .tag { font: 700 18px "Microsoft YaHei", "SimHei", sans-serif; }
      .center { text-anchor: middle; }
      .line { stroke: #667085; stroke-width: 3; fill: none; }
      .arrow { stroke: #667085; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7c3aed; stroke-width: 3; stroke-dasharray: 10 8; fill: none; marker-end: url(#purpleArrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#667085"/>
    </marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#101828" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1920" height="1500" fill="#f8fafc"/>
  <text x="960" y="60" class="title center">图方法的层级关系与关系推断流程</text>
  <text x="960" y="98" class="body center">上半部分只表示“包含关系”；下半部分只表示“执行顺序”</text>

  <!-- ==================== Hierarchy ==================== -->
  <text x="70" y="150" class="section">A. 层级关系：按方法的主要目标划分</text>

  <rect x="670" y="172" rx="18" width="580" height="70" fill="#172033" filter="url(#shadow)"/>
  <text x="960" y="216" class="h1 center" style="fill:#ffffff">图信息建模方法</text>

  <path d="M960 242 L960 270 L690 270 L690 298" class="line"/>
  <path d="M960 270 L1560 270 L1560 298" class="line"/>

  <!-- Classic analysis and relational inference -->
  <rect x="60" y="298" rx="20" width="1320" height="420" fill="#eef6ff" stroke="#4b8edb" stroke-width="3" filter="url(#shadow)"/>
  <rect x="60" y="298" rx="20" width="1320" height="66" fill="#d9ebff"/>
  <text x="720" y="340" class="h1 center">一、经典图分析与关系推断</text>

  <!-- structure description -->
  <rect x="90" y="390" rx="16" width="350" height="285" fill="#ffffff" stroke="#73a9e6" stroke-width="2"/>
  <text x="265" y="428" class="h1 center">1. 结构描述／特征工程</text>
  <text x="115" y="464" class="body">任务：把结构变成显式特征</text>
  <text x="115" y="501" class="small">节点：度、中心性、聚类系数、GDV</text>
  <text x="115" y="533" class="small">连接：共同邻居、Jaccard、Katz</text>
  <text x="115" y="565" class="small">全图：度分布、Graphlet 核、WL 核</text>
  <rect x="115" y="598" rx="11" width="300" height="48" fill="#eaf3ff"/>
  <text x="265" y="629" class="h2 center">输出：xᵥ、xᵤᵥ、xᴳ</text>
  <text x="265" y="666" class="small center">描述结构，不直接推断未知标签</text>

  <!-- PageRank -->
  <rect x="465" y="390" rx="16" width="250" height="285" fill="#ffffff" stroke="#98a2b3" stroke-width="2"/>
  <text x="590" y="428" class="h1 center">2. 链接重要性</text>
  <text x="590" y="463" class="h2 center">PageRank／PPR</text>
  <text x="490" y="506" class="small">任务：根据链接结构</text>
  <text x="490" y="536" class="small">计算节点的重要性、</text>
  <text x="490" y="566" class="small">接近度或推荐分数。</text>
  <rect x="490" y="598" rx="11" width="200" height="48" fill="#f2f4f7"/>
  <text x="590" y="629" class="h2 center">输出：排名分数</text>

  <!-- relational inference parent -->
  <rect x="740" y="378" rx="18" width="610" height="312" fill="#ecfdf3" stroke="#2ca56d" stroke-width="3"/>
  <text x="1045" y="416" class="h1 center">3. 关系推断</text>
  <text x="1045" y="448" class="small center">利用关系、少量标签、当前预测或概率依赖推断未知标签</text>

  <!-- diffusion branch -->
  <rect x="765" y="474" rx="13" width="188" height="188" fill="#ffffff" stroke="#4bc889" stroke-width="2"/>
  <text x="859" y="506" class="h2 center">3.1 扩散与后处理</text>
  <rect x="782" y="526" rx="9" width="154" height="46" fill="#d1fadf"/>
  <text x="859" y="556" class="h2 center">标签传播 LP</text>
  <rect x="782" y="586" rx="9" width="154" height="54" fill="#eaf3ff"/>
  <text x="859" y="608" class="h2 center">C&amp;S</text>
  <text x="859" y="631" class="small center">两次使用扩散</text>

  <!-- collective classification -->
  <rect x="971" y="474" rx="13" width="170" height="188" fill="#ffffff" stroke="#f0a13e" stroke-width="2"/>
  <text x="1056" y="506" class="h2 center">3.2 集体分类</text>
  <rect x="988" y="526" rx="9" width="136" height="46" fill="#fff0dc"/>
  <text x="1056" y="556" class="h2 center">ICA</text>
  <text x="1056" y="596" class="small center">属性分类器</text>
  <text x="1056" y="624" class="small center">＋关系分类器</text>
  <text x="1056" y="650" class="tag center" fill="#b54708">不是基本 LP</text>

  <!-- probabilistic inference -->
  <rect x="1159" y="474" rx="13" width="166" height="188" fill="#ffffff" stroke="#a77adc" stroke-width="2"/>
  <text x="1242" y="506" class="h2 center">3.3 概率推断</text>
  <rect x="1176" y="526" rx="9" width="132" height="46" fill="#f1e8ff"/>
  <text x="1242" y="556" class="h2 center">置信传播 BP</text>
  <text x="1242" y="596" class="small center">节点势＋边势</text>
  <text x="1242" y="624" class="small center">有向边条件消息</text>
  <text x="1242" y="650" class="tag center" fill="#6941c6">不是 LP</text>

  <!-- Representation learning -->
  <rect x="1410" y="298" rx="20" width="450" height="420" fill="#f5f0ff" stroke="#8656ce" stroke-width="3" filter="url(#shadow)"/>
  <rect x="1410" y="298" rx="20" width="450" height="66" fill="#e8dcff"/>
  <text x="1635" y="340" class="h1 center">二、图表示学习</text>
  <rect x="1440" y="390" rx="15" width="390" height="112" fill="#ffffff" stroke="#bba0e9" stroke-width="2"/>
  <text x="1635" y="428" class="h1 center">1. 浅层嵌入</text>
  <text x="1635" y="466" class="body center">DeepWalk、Node2Vec</text>
  <rect x="1440" y="526" rx="15" width="390" height="134" fill="#ffffff" stroke="#bba0e9" stroke-width="2"/>
  <text x="1635" y="564" class="h1 center">2. 深度图编码器</text>
  <text x="1635" y="600" class="body center">GNN／MPNN</text>
  <text x="1635" y="632" class="small center">学习消息函数与节点表示</text>
  <text x="1635" y="696" class="small center">输出：可复用嵌入 hᵥ、hᵤᵥ、hᴳ</text>

  <!-- hierarchy annotations -->
  <path d="M440 625 C570 710 735 700 1000 676" class="arrow"/>
  <text x="650" y="710" class="small center">结构特征可成为关系推断的输入，但二者不是包含关系</text>

  <!-- ==================== Workflows ==================== -->
  <text x="70" y="770" class="section">B. 流程关系：四种关系推断方法分别怎样工作</text>

  <!-- LP lane -->
  <rect x="70" y="804" rx="14" width="1780" height="102" fill="#f0fdf6" stroke="#4bc889" stroke-width="2"/>
  <rect x="88" y="821" rx="10" width="155" height="68" fill="#d1fadf"/>
  <text x="166" y="850" class="h2 center">标签传播</text>
  <text x="166" y="876" class="small center">固定扩散规则</text>
  <rect x="290" y="821" rx="10" width="280" height="68" fill="#ffffff" stroke="#6fd29b"/>
  <text x="430" y="850" class="body center">输入：图 G＋已知标签 Yᴸ</text>
  <text x="430" y="876" class="small center">通常不需要基础分类器</text>
  <path d="M570 855 L690 855" class="arrow"/>
  <rect x="690" y="821" rx="10" width="470" height="68" fill="#ffffff" stroke="#6fd29b"/>
  <text x="925" y="850" class="body center">反复传播并平均邻居的标签分数</text>
  <text x="925" y="876" class="small center">已标注节点通常保持固定</text>
  <path d="M1160 855 L1280 855" class="arrow"/>
  <rect x="1280" y="821" rx="10" width="520" height="68" fill="#ffffff" stroke="#6fd29b"/>
  <text x="1540" y="850" class="body center">输出：未标注节点的平滑标签分数</text>
  <text x="1540" y="876" class="small center">核心假设通常是相邻节点标签相近</text>

  <!-- ICA lane -->
  <rect x="70" y="926" rx="14" width="1780" height="112" fill="#fff9f0" stroke="#f0a13e" stroke-width="2"/>
  <rect x="88" y="947" rx="10" width="155" height="68" fill="#fff0dc"/>
  <text x="166" y="976" class="h2 center">ICA</text>
  <text x="166" y="1002" class="small center">集体分类</text>
  <rect x="290" y="947" rx="10" width="280" height="68" fill="#ffffff" stroke="#f0a13e"/>
  <text x="430" y="976" class="body center">输入：G、属性 X、Yᴸ</text>
  <text x="430" y="1002" class="small center">结构描述可并入 fᵥ</text>
  <path d="M570 981 L650 981" class="arrow"/>
  <rect x="650" y="947" rx="10" width="260" height="68" fill="#ffffff" stroke="#f0a13e"/>
  <text x="780" y="976" class="body center">φ₁(fᵥ) 产生初始预测</text>
  <text x="780" y="1002" class="small center">只看属性或显式特征</text>
  <path d="M910 981 L990 981" class="arrow"/>
  <rect x="990" y="940" rx="10" width="470" height="82" fill="#ffffff" stroke="#f0a13e"/>
  <text x="1225" y="970" class="body center">循环：标签 → 邻居摘要 zᵥ</text>
  <text x="1225" y="999" class="body center">φ₂(fᵥ,zᵥ) → 新标签</text>
  <path d="M1460 981 L1540 981" class="arrow"/>
  <rect x="1540" y="947" rx="10" width="260" height="68" fill="#ffffff" stroke="#f0a13e"/>
  <text x="1670" y="976" class="body center">输出：迭代分类结果</text>
  <text x="1670" y="1002" class="small center">不是邻居分数的简单平均</text>

  <!-- C&S lane -->
  <rect x="70" y="1058" rx="14" width="1780" height="112" fill="#f2f7ff" stroke="#5c91db" stroke-width="2"/>
  <rect x="88" y="1079" rx="10" width="155" height="68" fill="#dcecff"/>
  <text x="166" y="1108" class="h2 center">C&amp;S</text>
  <text x="166" y="1134" class="small center">图后处理</text>
  <rect x="290" y="1079" rx="10" width="300" height="68" fill="#ffffff" stroke="#5c91db"/>
  <text x="440" y="1108" class="body center">输入：G、Yᴸ、基础预测</text>
  <text x="440" y="1134" class="small center">基础模型可以使用结构特征</text>
  <path d="M590 1113 L690 1113" class="arrow"/>
  <rect x="690" y="1079" rx="10" width="350" height="68" fill="#ffffff" stroke="#5c91db"/>
  <text x="865" y="1108" class="body center">Correct：传播已知预测残差</text>
  <text x="865" y="1134" class="small center">修正基础模型的系统误差</text>
  <path d="M1040 1113 L1140 1113" class="arrow"/>
  <rect x="1140" y="1079" rx="10" width="350" height="68" fill="#ffffff" stroke="#5c91db"/>
  <text x="1315" y="1108" class="body center">Smooth：传播修正后的类别分数</text>
  <text x="1315" y="1134" class="small center">两阶段都使用 LP 式扩散算子</text>
  <path d="M1490 1113 L1570 1113" class="arrow"/>
  <rect x="1570" y="1079" rx="10" width="230" height="68" fill="#ffffff" stroke="#5c91db"/>
  <text x="1685" y="1108" class="body center">输出：校正结果</text>
  <text x="1685" y="1134" class="small center">C&amp;S ≠ 基本 LP</text>

  <!-- BP lane -->
  <rect x="70" y="1190" rx="14" width="1780" height="112" fill="#f8f4ff" stroke="#9b6ed4" stroke-width="2"/>
  <rect x="88" y="1211" rx="10" width="155" height="68" fill="#ebdfff"/>
  <text x="166" y="1240" class="h2 center">BP</text>
  <text x="166" y="1266" class="small center">概率推断</text>
  <rect x="290" y="1211" rx="10" width="360" height="68" fill="#ffffff" stroke="#9b6ed4"/>
  <text x="470" y="1240" class="body center">输入：G、局部证据、节点势／边势</text>
  <text x="470" y="1266" class="small center">边势可表达同质或异配关系</text>
  <path d="M650 1245 L750 1245" class="arrow"/>
  <rect x="750" y="1204" rx="10" width="570" height="82" fill="#ffffff" stroke="#9b6ed4"/>
  <text x="1035" y="1234" class="body center">循环：更新每条有向边的消息 mᵤ→ᵥ</text>
  <text x="1035" y="1263" class="small center">计算 u→v 时排除 v→u，再组合成节点 belief</text>
  <path d="M1320 1245 L1420 1245" class="arrow"/>
  <rect x="1420" y="1211" rx="10" width="380" height="68" fill="#ffffff" stroke="#9b6ed4"/>
  <text x="1610" y="1240" class="body center">输出：边缘概率／近似置信度</text>
  <text x="1610" y="1266" class="small center">树上精确；有环图中近似</text>

  <!-- ==================== Common mechanism ==================== -->
  <rect x="150" y="1340" rx="18" width="1620" height="116" fill="#ffffff" stroke="#7c3aed" stroke-width="3" stroke-dasharray="12 8" filter="url(#shadow)"/>
  <text x="960" y="1380" class="h1 center" style="fill:#6d28d9">一般消息传递是计算模板，不是新的方法层级</text>
  <text x="960" y="1416" class="body center">发送 MESSAGE → 聚合 AGGREGATE → 更新 UPDATE</text>
  <text x="960" y="1444" class="small center">LP 传标签分数；ICA 传预测形成的关系摘要；C&amp;S 传残差或类别分数；BP 传条件证据；GNN 传可学习隐藏向量。</text>
</svg>
